
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retro Web Desktop</title>

<style>
/* ===== DESKTOP WIDGET ===== */
.retro-desktop {
    position: relative;
    width: 100%;
    max-width: 2000px;
    max-height:1000px;
    margin: 24px auto;
    overflow: hidden;
    background: #008080;
    font: 12px Tahoma, Arial, sans-serif;
    color: #000;
    user-select: none;
    isolation: isolate;
}

.retro-desktop * { box-sizing: border-box; }

.desktop-icons {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 14px;
    width: 90px;
}

.desktop-icon {
    color: white;
    text-shadow: 1px 1px #000;
    text-align: center;
    cursor: pointer;
    width: 68px;
    padding: 5px 2px;
    border: 1px solid transparent;
}

.desktop-icon:hover {
    background: rgba(0, 0, 128, .4);
    border: 1px dotted white;
}

.desktop-icon .emoji {
    display: block;
    font-size: 30px;
    margin-bottom: 5px;
}

/* ===== WINDOWS 98 WINDOW FRAME ===== */
.win {
    position: absolute;
    top: 35px;
    left: 100px;
    width: max-content;
    max-width: calc(100% - 12px);
    padding: 4px;
    background: #c0c0c0;
    border-top: 2px solid white;
    border-left: 2px solid white;
    border-right: 2px solid #404040;
    border-bottom: 2px solid #404040;
    box-shadow: 2px 2px 5px #0006;
}

.title-bar {
    height: 24px;
    padding: 3px 4px 3px 7px;
    background: linear-gradient(90deg, #000080, #1084d0);
    color: white;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    cursor: grab;
    touch-action: none;
}

.title-bar:active { cursor: grabbing; }

.title-actions { display: flex; gap: 3px; }

.win-btn, .retro-btn {
    background: #c0c0c0;
    border-top: 2px solid white;
    border-left: 2px solid white;
    border-right: 2px solid #404040;
    border-bottom: 2px solid #404040;
    color: black;
    font: bold 12px Tahoma, sans-serif;
    cursor: pointer;
}

.win-btn {
    width: 18px;
    height: 18px;
    padding: 0;
    line-height: 13px;
}

.win-btn:active, .retro-btn:active {
    border-top: 2px solid #404040;
    border-left: 2px solid #404040;
    border-right: 2px solid white;
    border-bottom: 2px solid white;
}

.window-content { padding-top: 7px; }

/* ===== MINESWEEPER ===== */
.game-panel {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px;
    margin-bottom: 7px;
    border-top: 2px solid #808080;
    border-left: 2px solid #808080;
    border-right: 2px solid white;
    border-bottom: 2px solid white;
}

.lcd {
    background: black;
    color: red;
    font: bold 22px "Courier New", monospace;
    padding: 2px 4px;
    min-width: 48px;
    text-align: center;
}

.face {
    width: 30px;
    height: 30px;
    font-size: 19px;
    padding: 0;
}

.board {
    display: grid;
    grid-template-columns: repeat(9, 24px);
    grid-template-rows: repeat(9, 24px);
    border-top: 3px solid #808080;
    border-left: 3px solid #808080;
    border-right: 3px solid white;
    border-bottom: 3px solid white;
}

.cell {
    width: 24px;
    height: 24px;
    padding: 0;
    background: #c0c0c0;
    border-top: 2px solid white;
    border-left: 2px solid white;
    border-right: 2px solid #808080;
    border-bottom: 2px solid #808080;
    font: bold 14px Tahoma, sans-serif;
    text-align: center;
    cursor: pointer;
}

.cell.revealed {
    border: 1px solid #808080;
}

.cell[data-val="1"] { color: blue; }
.cell[data-val="2"] { color: green; }
.cell[data-val="3"] { color: red; }
.cell[data-val="4"] { color: navy; }
.cell[data-val="5"] { color: maroon; }
.cell[data-val="6"] { color: teal; }
.cell[data-val="7"] { color: black; }
.cell[data-val="8"] { color: gray; }

/* ===== PAINT ===== */
.paint-tools {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 7px;
}

.paint-tools label { display: flex; align-items: center; gap: 3px; }

.retro-btn { padding: 4px 8px; }

.paint-canvas-wrap {
    border-top: 2px solid #808080;
    border-left: 2px solid #808080;
    border-right: 2px solid white;
    border-bottom: 2px solid white;
    background: white;
    line-height: 0;
    overflow: auto;
    max-width: 100%;
}

#paintCanvas {
    display: block;
    width: 480px;
    height: 300px;
    max-width: none;
    background: white;
    touch-action: none;
    cursor: crosshair;
}

.palette {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    margin-top: 7px;
}

.swatch {
    width: 22px;
    height: 22px;
    border: 2px solid;
    border-color: white #404040 #404040 white;
    cursor: pointer;
}

.swatch.selected { outline: 2px dotted black; outline-offset: -4px; }

.status-bar {
    margin-top: 6px;
    padding: 4px;
    border-top: 1px solid #808080;
    border-left: 1px solid #808080;
    border-right: 1px solid white;
    border-bottom: 1px solid white;
}

/* ===== TASKBAR ===== */
.taskbar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 34px;
    padding: 3px;
    display: flex;
    align-items: center;
    gap: 4px;
    background: #c0c0c0;
    border-top: 2px solid white;
    z-index: 10000;
}

.start-btn {
    font-weight: bold;
    height: 26px;
}

.task-btn {
    height: 26px;
    min-width: 90px;
    max-width: 150px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: left;
}

.task-btn.active {
    border-top: 2px solid #404040;
    border-left: 2px solid #404040;
    border-right: 2px solid white;
    border-bottom: 2px solid white;
    background: #b0b0b0;
}

.clock {
    margin-left: auto;
    border-top: 1px solid #808080;
    border-left: 1px solid #808080;
    border-right: 1px solid white;
    border-bottom: 1px solid white;
    padding: 5px 8px;
    white-space: nowrap;
}

@media (max-width: 560px) {
    .retro-desktop {
        height: 620px;
    }

    .win {
        left: 6px;
        top: 35px;
        max-width: calc(100% - 12px);
    }

    .desktop-icons {
        flex-direction: row;
        width: auto;
        gap: 6px;
    }

    .desktop-icon { width: 65px; }

    #paintWindow {
        width: calc(100% - 12px);
    }

    .paint-tools { gap: 4px; }

    .task-btn {
        min-width: 60px;
        max-width: 100px;
    }
}
</style>
</head>

<body>

<!-- This entire section is the desktop widget -->
<div class="retro-desktop" id="retroDesktop">

    <div class="desktop-icons">
        <div class="desktop-icon" data-open="minesWindow">
            <span class="emoji">💣</span>
            Minesweeper
        </div>
        <div class="desktop-icon" data-open="paintWindow">
            <span class="emoji">🎨</span>
            Paint
        </div>
    </div>

    <!-- MINESWEEPER WINDOW -->
    <section class="win" id="minesWindow" style="z-index: 2;">
        <div class="title-bar">
            <span>💣 Minesweeper</span>
            <div class="title-actions">
                <button class="win-btn" data-minimize="minesWindow"
                        aria-label="Minimize">_</button>
                <button class="win-btn" data-close="minesWindow"
                        aria-label="Close">×</button>
            </div>
        </div>

        <div class="window-content">
            <div class="game-panel">
                <div class="lcd" id="mineCount">010</div>
                <button class="retro-btn face" id="faceBtn"
                        aria-label="Restart game">🙂</button>
                <div class="lcd" id="timer">000</div>
            </div>
            <div class="board" id="board"></div>
            <div class="status-bar" id="mineStatus">
                Left-click to reveal · Right-click to flag
            </div>
        </div>
    </section>

    <!-- PAINT WINDOW -->
    <section class="win" id="paintWindow"
             style="left: 340px; top: 80px; z-index: 1; display: none;">
        <div class="title-bar">
            <span>🎨 Untitled - Paint</span>
            <div class="title-actions">
                <button class="win-btn" data-minimize="paintWindow"
                        aria-label="Minimize">_</button>
                <button class="win-btn" data-close="paintWindow"
                        aria-label="Close">×</button>
            </div>
        </div>

        <div class="window-content">
            <div class="paint-tools">
                <label>
                    Tool
                    <select id="paintTool">
                        <option value="pencil">Pencil</option>
                        <option value="eraser">Eraser</option>
                    </select>
                </label>

                <label>
                    Size
                    <input id="brushSize" type="range"
                           min="1" max="24" value="4">
                </label>

                <button class="retro-btn" id="clearPaint">Clear</button>
                <button class="retro-btn" id="savePaint">Save PNG</button>
            </div>

            <div class="paint-canvas-wrap">
                <canvas id="paintCanvas"
                        width="480" height="300"></canvas>
            </div>

            <div class="palette" id="palette"></div>
            <div class="status-bar" id="paintStatus">
                Pencil · Black
            </div>
        </div>
    </section>

    <!-- TASKBAR -->
    <div class="taskbar">
        <button class="retro-btn start-btn"
                id="startBtn">🪟 Start</button>
        <button class="retro-btn task-btn" data-task="minesWindow">
            💣 Minesweeper
        </button>
        <button class="retro-btn task-btn" data-task="paintWindow">
            🎨 Paint
        </button>
        <div class="clock" id="clock">12:00</div>
    </div>
</div>

<script>
/* ======================================
   1. WINDOW MANAGEMENT AND DRAGGING
   ====================================== */

const desktop = document.getElementById("retroDesktop");
let topZ = 10;

function focusWindow(win) {
    topZ++;
    win.style.zIndex = topZ;
    updateTaskbar();
}

function openWindow(id) {
    const win = document.getElementById(id);
    win.style.display = "block";
    focusWindow(win);
    updateTaskbar();
}

function minimizeWindow(id) {
    document.getElementById(id).style.display = "none";
    updateTaskbar();
}

function updateTaskbar() {
    document.querySelectorAll("[data-task]").forEach(button => {
        const win = document.getElementById(button.dataset.task);
        button.classList.toggle(
            "active",
            win.style.display !== "none" &&
            Number(win.style.zIndex) === topZ
        );
    });
}

// Drag only from the title bar, not the window's buttons.
document.querySelectorAll(".title-bar").forEach(bar => {
    const win = bar.closest(".win");

    bar.addEventListener("pointerdown", event => {
        if (event.target.closest("button")) return;

        focusWindow(win);

        const startX = event.clientX;
        const startY = event.clientY;
        const originalLeft = win.offsetLeft;
        const originalTop = win.offsetTop;

        bar.setPointerCapture(event.pointerId);

        function move(e) {
            const maxLeft = Math.max(0, desktop.clientWidth - win.offsetWidth);
            const maxTop = Math.max(
                0, desktop.clientHeight - 36 - win.offsetHeight
            );

            win.style.left = Math.max(0, Math.min(
                maxLeft, originalLeft + e.clientX - startX
            )) + "px";

            win.style.top = Math.max(0, Math.min(
                maxTop, originalTop + e.clientY - startY
            )) + "px";
        }

        function stop() {
            bar.removeEventListener("pointermove", move);
            bar.removeEventListener("pointerup", stop);
            bar.removeEventListener("pointercancel", stop);
        }

        bar.addEventListener("pointermove", move);
        bar.addEventListener("pointerup", stop);
        bar.addEventListener("pointercancel", stop);
    });

    win.addEventListener("pointerdown", () => focusWindow(win));
});

document.querySelectorAll("[data-open]").forEach(icon => {
    icon.addEventListener("click", () => openWindow(icon.dataset.open));
});

document.querySelectorAll("[data-close]").forEach(button => {
    button.addEventListener("click", () => {
        minimizeWindow(button.dataset.close);
    });
});

document.querySelectorAll("[data-minimize]").forEach(button => {
    button.addEventListener("click", () => {
        minimizeWindow(button.dataset.minimize);
    });
});

document.querySelectorAll("[data-task]").forEach(button => {
    button.addEventListener("click", () => {
        const id = button.dataset.task;
        const win = document.getElementById(id);

        if (win.style.display === "none") {
            openWindow(id);
        } else if (Number(win.style.zIndex) === topZ) {
            minimizeWindow(id);
        } else {
            focusWindow(win);
        }
    });
});

document.getElementById("startBtn").addEventListener("click", () => {
    openWindow("minesWindow");
});

function updateClock() {
    document.getElementById("clock").textContent =
        new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });
}
updateClock();
setInterval(updateClock, 30000);


/* ======================================
   2. MINESWEEPER
   ====================================== */

const ROWS = 9, COLS = 9, MINES = 10;

const boardEl = document.getElementById("board");
const mineCountEl = document.getElementById("mineCount");
const timerEl = document.getElementById("timer");
const faceBtn = document.getElementById("faceBtn");
const mineStatus = document.getElementById("mineStatus");

let cells = [];
let firstClick, gameOver, flags, elapsed, timer;

function initGame() {
    clearInterval(timer);
    firstClick = true;
    gameOver = false;
    flags = 0;
    elapsed = 0;
    cells = [];

    timerEl.textContent = "000";
    mineCountEl.textContent = "010";
    faceBtn.textContent = "🙂";
    mineStatus.textContent =
        "Left-click to reveal · Right-click to flag";
    boardEl.innerHTML = "";

    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const cell = {
                r, c,
                mine: false,
                revealed: false,
                flagged: false,
                count: 0
            };

            const el = document.createElement("button");
            el.className = "cell";
            el.setAttribute("aria-label", `Row ${r + 1}, column ${c + 1}`);
            el.addEventListener("click", () => reveal(r, c));
            el.addEventListener("contextmenu", e => {
                e.preventDefault();
                toggleFlag(r, c);
            });

            cell.el = el;
            cells.push(cell);
            boardEl.appendChild(el);
        }
    }
}

function getCell(r, c) {
    if (r < 0 || c < 0 || r >= ROWS || c >= COLS) return null;
    return cells[r * COLS + c];
}

function neighbors(cell) {
    const result = [];
    for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const next = getCell(cell.r + dr, cell.c + dc);
            if (next) result.push(next);
        }
    }
    return result;
}

function placeMines(safeCell) {
    // Keep the first clicked cell and its neighbors safe.
    const safe = new Set([
        safeCell,
        ...neighbors(safeCell)
    ]);

    const available = cells.filter(c => !safe.has(c));
    for (let i = available.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [available[i], available[j]] = [available[j], available[i]];
    }

    available.slice(0, MINES).forEach(c => c.mine = true);

    cells.forEach(c => {
        c.count = neighbors(c).filter(n => n.mine).length;
    });
}

function startTimer() {
    timer = setInterval(() => {
        elapsed = Math.min(999, elapsed + 1);
        timerEl.textContent = String(elapsed).padStart(3, "0");
        if (elapsed >= 999) clearInterval(timer);
    }, 1000);
}

function reveal(r, c) {
    if (gameOver) return;

    const cell = getCell(r, c);
    if (cell.revealed || cell.flagged) return;

    if (firstClick) {
        placeMines(cell);
        firstClick = false;
        startTimer();
    }

    if (cell.mine) {
        cell.el.textContent = "💣";
        cell.el.classList.add("revealed");
        cell.el.style.background = "#ff7777";

        cells.filter(c => c.mine).forEach(c => {
            c.el.textContent = "💣";
            c.el.classList.add("revealed");
        });

        gameOver = true;
        clearInterval(timer);
        faceBtn.textContent = "😵";
        mineStatus.textContent = "Game over! Click ☺️ to restart.";
        return;
    }

    // Queue-based flood fill reveals empty areas without deep recursion.
    const queue = [cell];

    while (queue.length) {
        const current = queue.pop();
        if (current.revealed || current.flagged || current.mine) continue;

        current.revealed = true;
        current.el.classList.add("revealed");

        if (current.count > 0) {
            current.el.textContent = current.count;
            current.el.dataset.val = current.count;
        } else {
            neighbors(current).forEach(n => {
                if (!n.revealed && !n.flagged && !n.mine) {
                    queue.push(n);
                }
            });
        }
    }

    checkWin();
}

function toggleFlag(r, c) {
    if (gameOver || firstClick && false) {
        if (gameOver) return;
    }

    const cell = getCell(r, c);
    if (cell.revealed) return;

    cell.flagged = !cell.flagged;
    cell.el.textContent = cell.flagged ? "🚩" : "";
    flags += cell.flagged ? 1 : -1;

    mineCountEl.textContent =
        String(MINES - flags).padStart(3, "0");
}

function checkWin() {
    const safeLeft = cells.filter(c => !c.mine && !c.revealed).length;

    if (safeLeft === 0) {
        gameOver = true;
        clearInterval(timer);
        faceBtn.textContent = "😎";
        mineStatus.textContent = "You win! Click 😎 to play again.";

        cells.filter(c => c.mine && !c.flagged).forEach(c => {
            c.flagged = true;
            c.el.textContent = "🚩";
        });

        flags = MINES;
        mineCountEl.textContent = "000";
    }
}

faceBtn.addEventListener("click", initGame);
initGame();


/* ======================================
   3. PAINT
   ====================================== */

const canvas = document.getElementById("paintCanvas");
const ctx = canvas.getContext("2d");
const toolSelect = document.getElementById("paintTool");
const brushSize = document.getElementById("brushSize");
const paintStatus = document.getElementById("paintStatus");
const palette = document.getElementById("palette");

const colors = [
    "#000000", "#ffffff", "#808080", "#c0c0c0",
    "#800000", "#ff0000", "#808000", "#ffff00",
    "#008000", "#00ff00", "#008080", "#00ffff",
    "#000080", "#0000ff", "#800080", "#ff00ff",
    "#804000", "#ff8000"
];

let paintColor = "#000000";
let drawing = false;
let lastPoint = null;

ctx.fillStyle = "white";
ctx.fillRect(0, 0, canvas.width, canvas.height);

colors.forEach(color => {
    const swatch = document.createElement("button");
    swatch.className = "swatch";
    swatch.style.background = color;
    swatch.title = color;
    swatch.setAttribute("aria-label", "Choose " + color);

    if (color === paintColor) swatch.classList.add("selected");

    swatch.addEventListener("click", () => {
        paintColor = color;
        palette.querySelectorAll(".swatch").forEach(s => {
            s.classList.toggle("selected", s === swatch);
        });
        updatePaintStatus();
    });

    palette.appendChild(swatch);
});

function updatePaintStatus() {
    paintStatus.textContent =
        (toolSelect.value === "eraser" ? "Eraser" : "Pencil") +
        " · " + paintColor +
        " · Size " + brushSize.value;
}

toolSelect.addEventListener("change", updatePaintStatus);
brushSize.addEventListener("input", updatePaintStatus);

function pointFromEvent(e) {
    const rect = canvas.getBoundingClientRect();

    return {
        x: (e.clientX - rect.left) * canvas.width / rect.width,
        y: (e.clientY - rect.top) * canvas.height / rect.height
    };
}

function drawSegment(from, to) {
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.lineWidth = Number(brushSize.value);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // Eraser paints white over the existing drawing.
    ctx.strokeStyle =
        toolSelect.value === "eraser" ? "#ffffff" : paintColor;

    ctx.stroke();
}

canvas.addEventListener("pointerdown", e => {
    drawing = true;
    canvas.setPointerCapture(e.pointerId);
    lastPoint = pointFromEvent(e);

    // Draw a dot if the user just taps the canvas.
    drawSegment(lastPoint, {
        x: lastPoint.x + 0.01,
        y: lastPoint.y + 0.01
    });
});

canvas.addEventListener("pointermove", e => {
    if (!drawing || !lastPoint) return;

    const point = pointFromEvent(e);
    drawSegment(lastPoint, point);
    lastPoint = point;
});

function stopDrawing() {
    drawing = false;
    lastPoint = null;
}

canvas.addEventListener("pointerup", stopDrawing);
canvas.addEventListener("pointercancel", stopDrawing);

document.getElementById("clearPaint").addEventListener("click", () => {
    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
});

document.getElementById("savePaint").addEventListener("click", () => {
    const link = document.createElement("a");
    link.download = "my-painting.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
});
</script>
</body>
</html>
