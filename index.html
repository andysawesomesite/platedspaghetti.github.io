<!-- the script part should make the dragging work, making it possible to place the player where the user wants. audio works just fine...  and i considered makign the background transparent but the margin looks nice. -->
<div id="player" draggable="true" style="position: fixed; top: 15%; right: 20px; z-index: 1000; background: #000000; border: 1px solid #000000; padding: 5px; border-radius: 5px; box-shadow: 2px 4px 10px rgba(0,0,0,0.2); cursor: move;">
    <audio controls loop, src="toby fox - UNDERTALE Soundtrack - 31 Waterfall.mp3"></audio>
</div>

<script>
    const player = document.getElementById('player');
	    player.addEventListener('dragstart', (e) => {
        player.style.right = 'auto';
		    });
    player.addEventListener('dragend', (e) => {
        player.style.left = e.clientX + 'px';
        player.style.top = e.clientY + 'px';
    });
</script>
</script>
